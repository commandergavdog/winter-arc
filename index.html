<title>Winter Arc</title>

<style>
/* Layout: compact training-log app. Sticky header carries a 12-pitch progress rope; Today is a two-column logbook on desktop, one column on phones with a bottom tab bar. */
/* Identity: single dark theme by choice. Charcoal ground, lifted charcoal cards, one neon-lime accent; phases step from olive to full lime. */
:root {
  --bg: #161618;
  --surface: #232327;
  --sunk: #2F3035;
  --ink: #F4F5F0;
  --muted: #9B9CA2;
  --line: #36373D;
  --accent: #D4F85A;
  --accent-soft: #363F17;
  --on-accent: #14150F;
  --p1: #7C9138;
  --p2: #A9CB45;
  --p3: #D4F85A;
  --warn: #FF7A6B;
  --warn-soft: #3B211E;
  --f-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 24px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 12px 10px; }
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.brand-mark { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .08em; text-transform: uppercase; }
.brand-sub { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; }
.tabs a { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sync[data-s="saved"]::before { background: var(--p2); }
.sync[data-s="saving"]::before, .sync[data-s="pending"]::before { background: var(--accent); }
.sync[data-s="error"], .sync[data-s="stale"] { color: var(--warn); }
.sync[data-s="error"]::before, .sync[data-s="stale"]::before { background: var(--warn); }
.pitch { display: flex; gap: 3px; padding-bottom: 10px; }
.pitch span { flex: 1; height: 6px; border-radius: 2px; background: var(--sunk); position: relative; overflow: hidden; }
.pitch span.past { background: var(--pc); }
.pitch span i { position: absolute; inset: 0 auto 0 0; background: var(--pc); }
.pitch span.cur { box-shadow: 0 0 0 1.5px var(--accent); }

@media (max-width: 720px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .tabs a { flex: 1; text-align: center; padding: 10px 4px; font-size: 16px; }
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .brand-mark { font-size: 21px; }
}

main { padding-block: 0 56px; }

/* Shared pieces */
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 12px; }
.panel-h h2, .panel-h h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.panel-b { padding: 0 16px 16px; }
.section-h { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .03em; text-transform: uppercase; margin: 32px 0 12px; }
.pill { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill[data-s="done"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill[data-s="partial"] { border-color: var(--ink); color: var(--ink); }
.pill[data-s="skipped"] { background: repeating-linear-gradient(135deg, var(--sunk) 0 3px, transparent 3px 7px); color: var(--ink); }
.pill[data-s="today"] { border-color: var(--accent); color: var(--accent); }
.btn { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; line-height: 1.1; }
.btn:hover { filter: brightness(1.12); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); filter: none; }
.btn.sm { font-size: 14px; padding: 6px 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.field { font: inherit; font-family: var(--f-mono); font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.field:focus { border-color: var(--ink); outline: none; }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field:disabled { opacity: .7; }
textarea.field { font-family: var(--f-body); font-size: 14px; resize: vertical; min-height: 84px; line-height: 1.45; }
.notice { background: var(--sunk); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notice b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.notice.hot { background: var(--accent-soft); }
.notice.hot b { color: var(--accent); }
.notice.warn { background: var(--accent-soft); }
.notice.warn b { color: var(--warn); }

/* Today */
.day-head { display: grid; gap: 8px; padding-block: 26px 14px; }
.day-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.day-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 7vw, 60px); line-height: .92; letter-spacing: .01em; text-transform: uppercase; }
.day-sub { font-size: 18px; font-weight: 600; }
.day-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.daynav { display: flex; gap: 6px; }
.daynav .btn { min-width: 44px; }
.notices { display: grid; gap: 8px; margin-bottom: 14px; }
.day-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.blocks { display: grid; gap: 14px; min-width: 0; }
.aside { position: sticky; top: 104px; display: grid; gap: 14px; }
@media (max-width: 880px) { .day-grid { grid-template-columns: minmax(0, 1fr); } .aside { position: static; } }

.kind { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.item input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); cursor: pointer; }
.item label { cursor: pointer; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
.item-name { font-weight: 600; }
.item.is-done .item-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.rx { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunk); padding: 1px 7px; border-radius: 4px; }
.item .note { color: var(--muted); font-size: 13.5px; margin-top: 4px; max-width: 62ch; }
.item .field { margin-top: 8px; }
.lift { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 96px)) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.lift label.lnote { grid-column: 1 / -1; }
.lift label { display: grid; gap: 3px; min-width: 0; justify-content: stretch; }
.lift label span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.item .lift .field { margin-top: 0; }
@media (max-width: 520px) { .lift { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); } }
.lift-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lift-ctl select { max-width: 260px; width: auto; flex: 1 1 180px; }
.chip.txt { font-family: var(--f-body); font-size: 13px; padding: 7px 12px; }
.tbl tr.sel td { background: var(--sunk); }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: var(--ink); }
.last { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.last b { font-weight: 500; color: var(--ink); }

.log-group { display: grid; gap: 8px; }
.log-group + .log-group { margin-top: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-width: 42px; padding: 6px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-family: var(--f-mono); font-size: 14px; cursor: pointer; display: grid; justify-items: center; line-height: 1.15; }
.chip small { font-family: var(--f-body); font-size: 10.5px; color: var(--muted); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: var(--bg); }
.chip:disabled { cursor: not-allowed; opacity: .6; }
.chips.fingers .chip { flex: 1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1; }

/* Program */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-block: 26px 4px; }
.stat { padding: 14px 16px; }
.stat .n { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; }
.stat .n small { font-size: 20px; color: var(--muted); font-weight: 600; }
.stat .l { margin-top: 6px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 18px 0 4px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
.legend i.done { background: var(--ink); border-color: var(--ink); }
.legend i.partial { box-shadow: inset 0 -4px 0 var(--ink); border-color: var(--ink); }
.legend i.skipped { background: repeating-linear-gradient(135deg, var(--line) 0 2px, var(--surface) 2px 5px); }
.legend i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.ph-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; }
.ph-head h3 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.ph-head h3::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--pc); }
.wk { display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); gap: 6px; align-items: center; margin-bottom: 6px; }
.wk-l { font-family: var(--f-mono); font-size: 12.5px; display: grid; line-height: 1.2; }
.wk-l small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.wk-h { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.wk-h span { display: block; font-family: var(--f-body); letter-spacing: 0; text-transform: none; font-size: 11.5px; }
.cell { min-height: 52px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; color: var(--ink); padding: 4px 2px; }
.cell small { font-size: 10px; color: var(--muted); font-weight: 400; }
.cell:hover { border-color: var(--ink); }
.cell.rest { background: transparent; border-style: dashed; color: var(--muted); }
.cell.partial { box-shadow: inset 0 -5px 0 var(--ink); border-color: var(--ink); }
.cell.done { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.cell.done small { color: var(--bg); opacity: .7; }
.cell.skipped { background: repeating-linear-gradient(135deg, var(--line) 0 2px, var(--surface) 2px 6px); color: var(--muted); }
.cell.missed { color: var(--muted); }
.cell.today { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 720px) { .wk-h span { display: none; } }
@media (max-width: 480px) { .wk { grid-template-columns: 40px repeat(7, minmax(0, 1fr)); gap: 4px; } .cell { min-height: 44px; font-size: 11px; } .cell small { display: none; } }

/* Progress */
.prog-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; padding-top: 26px; }
.prog-col { display: grid; gap: 20px; min-width: 0; }
@media (max-width: 900px) { .prog-grid { grid-template-columns: minmax(0, 1fr); } }
.bench-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 84px; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.bench-row.head { border-top: 0; padding-block: 0 8px; }
.bench-name { font-weight: 600; }
.bench-how { font-size: 12.5px; color: var(--muted); }
.bench-row label { display: grid; gap: 3px; }
.bench-row label span { display: none; }
.delta { font-family: var(--f-mono); font-size: 13px; text-align: right; color: var(--muted); }
.delta.good { color: var(--ink); font-weight: 500; }
@media (max-width: 560px) {
  .bench-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .bench-row > div:first-child { grid-column: 1 / -1; }
  .bench-row .delta { grid-column: 1 / -1; text-align: left; }
  .bench-row.head { display: none; }
  .bench-row label span { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
}
.body-form { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.body-form label { display: grid; gap: 3px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 480px) { .body-form { grid-template-columns: 1fr 1fr; } .body-form .btn { grid-column: 1 / -1; } }
.chart { width: 100%; height: auto; display: block; margin-top: 14px; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-lbl { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ch-area { fill: var(--accent); opacity: .12; }
.ch-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ch-end { fill: var(--accent); }
.ch-endlbl { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
.tbl-wrap { overflow-x: auto; margin-top: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num { font-family: var(--f-mono); }
.finger-strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.finger-strip .wkcol { display: grid; gap: 4px; }
.fcell { height: 26px; border-radius: 4px; border: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; display: grid; place-items: center; color: var(--muted); }
.fcell.f1 { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.fcell.f2 { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.fcell.f3 { background: var(--sunk); color: var(--ink); }
.fcell.f4 { background: var(--p1); border-color: var(--p1); color: var(--ink); }
.fcell.f5 { background: var(--p2); border-color: var(--p2); color: var(--surface); }
.fcols-l { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 4px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); text-align: center; }

/* Guide */
.guide { max-width: 860px; padding-top: 10px; }
.lede { font-size: 17px; max-width: 64ch; }
.phase-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .phase-cards { grid-template-columns: minmax(0, 1fr); } }
.phase-card { padding: 16px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--pc); }
.phase-card h3 { font-family: var(--f-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 70ch; }
.guide-sec { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.kv dd { margin: 0; }

/* ---------- Visual identity layer: pills, big rounded cards, sentence-case type, lime highlights ---------- */
body { font-variant-numeric: tabular-nums; }
.brand-mark, .tabs a, .panel-h h2, .panel-h h3, .section-h, .day-title, .btn, .ph-head h3, .phase-card h3, .eyebrow, .pill, .kind,
.wk-h, .wk-l small, .bench-row label span, .body-form label, .tbl th, .lift label span, .notice b { text-transform: none; letter-spacing: 0; }
.top { border-bottom: 0; }
.brand-mark { font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.brand-mark::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: 2px; }
.brand-sub { font-size: 12px; }
.tabs { gap: 6px; }
.tabs a { font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.tabs a:hover { color: var(--ink); }

  <div class="empty">Loading your training plan…</div>

<dialog class="done-dlg" id="done-dlg" aria-labelledby="d-title"></dialog>

<script>
(() => {
  "use strict";
  const DAY_MS = 864e5;
  const ROUTES = ["today", "program", "progress", "guide"];
  const S = {
    plan: null, start: null, startSaved: false,
    sessions: {}, bench: {}, body: {},
    db: null, user: null, canWrite: false, connected: false,
    route: "today", sel: null, userMoved: false, needsRender: false,
    loaded: { settings: false, sessions: false, bench: false, body: false },
    ui: {}
  };
  const view = document.getElementById("view");

  /* ---------- tiny DOM helpers ---------- */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, text) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    if (text != null) el.textContent = text;
    return el;
  }
  const clone = (o) => JSON.parse(JSON.stringify(o ?? {}));

  /* ---------- dates & plan lookups ---------- */
  const pad2 = (n) => String(n).padStart(2, "0");
  const parseISO = (str) => { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d); };
  const iso = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const todayDate = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const mondayOf = (d) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const mondayOnOrAfter = (d) => { const x = new Date(d); const dow = (x.getDay() + 6) % 7; if (dow) x.setDate(x.getDate() + 7 - dow); return x; };
  const idxOf = (date) => Math.round((date - parseISO(S.start)) / DAY_MS);
  const dateOf = (w, d) => { const x = parseISO(S.start); x.setDate(x.getDate() + (w - 1) * 7 + d); return x; };
  const fmtDate = (d, opts) => d.toLocaleDateString(undefined, opts || { weekday: "short", month: "short", day: "numeric" });
  function todayPos() { const i = idxOf(todayDate()); return { i, w: Math.floor(i / 7) + 1, d: ((i % 7) + 7) % 7 }; }
  const key = (w, d) => "w" + pad2(w) + "-" + S.plan.days[d].key;
  const phaseOf = (w) => S.plan.phases.find((p) => w >= p.weeks[0] && w <= p.weeks[1]);
  const phaseColor = (n) => "var(--p" + n + ")";
  const TOTAL_WEEKS = 12;
  const trainingDaysPerWeek = () => S.plan.days.filter((d) => !d.rest).length;

  function sessionDef(w, d) {
    const day = S.plan.days[d];
    const ph = phaseOf(w);
    const ov = S.plan.overrides && S.plan.overrides[String(w)] && S.plan.overrides[String(w)][day.key];
    const raw = ov ? ov.blocks : (ph.sessions[day.key] || []);
    const blocks = raw.map((b) => (typeof b === "string" ? S.plan.blocks[b] : b)).filter(Boolean);
    return {
      day, ph, blocks,
      title: ov ? ov.title : day.title,
      minutes: ov ? ov.minutes : day.minutes,
      items: blocks.flatMap((b) => b.items),
      rest: !!day.rest && !ov,
      climb: !!day.climb
    };
  }
  function statusOf(w, d) {
    const def = sessionDef(w, d);
    if (def.rest) return "rest";
    const doc = S.sessions[key(w, d)];
    if (!doc) return "none";
    if (doc.status === "done") return "done";
    if (doc.status === "skipped") return "skipped";
    const checks = doc.checks || {};
    const anyLog = Object.values(doc.logs || {}).some((v) => v && String(v).trim());
    const anyLift = Object.values(doc.lifts || {}).some(hasLift);
    if (def.items.some((it) => checks[it.id]) || anyLog || anyLift || namedExtras(doc).length || doc.rpe || doc.fingers || (doc.notes && doc.notes.trim())) return "partial";
    return "none";
  }
  // How an exercise is logged. "wr": sets, weight, reps. "w": weight only (hangs). "sr": bodyweight sets × reps.
  // "hold": sets × seconds. "cardio": minutes, miles, heart rate. null: free text. Every type also gets RPE and a note.
  const TRACKS = {
    wr:     { fields: ["sets", "lb", "reps", "rpe"], unit: "lb", more: "add weight" },
    w:      { fields: ["lb", "rpe"], unit: "lb", more: "add weight" },
    sr:     { fields: ["sets", "reps", "rpe"], unit: "reps", more: "add reps" },
    hold:   { fields: ["sets", "sec", "rpe"], unit: "s", more: "hold longer" },
    cardio: { fields: ["min", "dist", "hr", "rpe"], unit: "min", more: null },
    grade:  { fields: ["rpe"], unit: "V", more: null }
  };
  const FIELDS = {
    sets: { label: "Sets", mode: "numeric", step: "1", lo: 0, hi: 50 },
    lb:   { label: "Weight lb", mode: "decimal", step: "any", lo: -1000, hi: 2000 },
    reps: { label: "Reps", mode: "numeric", step: "1", lo: 0, hi: 1000 },
    sec:  { label: "Seconds", mode: "decimal", step: "any", lo: 0, hi: 3600 },
    min:  { label: "Minutes", mode: "decimal", step: "any", lo: 0, hi: 1440 },
    minutes: { label: "Minutes", mode: "decimal", step: "any", lo: 0, hi: 1440 },
    dist: { label: "Miles", mode: "decimal", step: "any", lo: 0, hi: 500 },

  /* ---------- PROGRAM ---------- */

  /* ---------- PROGRESS ---------- */
  function parseVal(b, v) {
    if (v == null || String(v).trim() === "") return null;

    if (b.type === "number") { const n = parseFloat(v.replace(",", ".")); return isFinite(n) ? n : null; }
    if (b.type === "time") { const m = v.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/); if (m) return +m[1] * 60 + +m[2]; const n = parseFloat(v); return isFinite(n) ? n : null; }

    const dl = z - a;

    const entries = Object.values(S.body).filter((e) => e && e.date).sort((a, b) => a.date.localeCompare(b.date));
    const fDate = h("input", { class: "field", type: "date", id: "b-date", value: iso(todayDate()), disabled: ro });
    const fW = h("input", { class: "field", type: "number", id: "b-weight", step: "0.1", inputmode: "decimal", placeholder: "lb", disabled: ro });

  function lineChart(pts, aria, unit) {

    const padY = (y1 - y0) * 0.15; y0 -= padY; y1 += padY;
    const X = (t) => L + ((t - x0) / (x1 - x0 || 1)) * (Wd - L - R);
    const Y = (v) => T + ((y1 - v) / (y1 - y0)) * (Ht - T - B);

      svg.append(s("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", class: "ch-lbl" }, unit === "V" ? "V" + v : String(v)));
    }
    const line = pts.map((p, i) => (i ? "L" : "M") + X(ts[i]).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");

    svg.append(s("path", { d: line + " L" + X(ts[ts.length - 1]).toFixed(1) + " " + base + " L" + X(ts[0]).toFixed(1) + " " + base + " Z", class: "ch-area" }));
    svg.append(s("path", { d: line, class: "ch-line" }));
    pts.forEach((p, i) => {
      const c = s("circle", { cx: X(ts[i]), cy: Y(p.v), r: i === pts.length - 1 ? 5 : 3, class: i === pts.length - 1 ? "ch-end" : "ch-dot" });

  const tRemaining = () => (T.end != null ? (T.end - Date.now()) / 1000 : T.left != null ? T.left : T.dur);
  let tEls = null;

  function stopwatchIcon() {
    const g = s("svg", { viewBox: "0 0 24 24", width: 20, height: 20, class: "t-ico", "aria-hidden": "true" });
    g.append(s("circle", { cx: 12, cy: 13.5, r: 7.5 }), s("path", { d: "M12 10v3.5l2.5 2M9.5 2.5h5M12 2.5V6M18.5 6.5l1.5-1.5" }));
    return g;
  }
  function buildTimer() {
    const dock = document.getElementById("timer");
    const fabTime = h("span", null);
    const fab = h("button", { class: "t-fab", type: "button", "aria-expanded": "false", "aria-controls": "timer-panel", onclick: () => setTimerOpen(!T.open) }, stopwatchIcon(), fabTime);
    const R = 56, C = 2 * Math.PI * R;
    const arc = s("circle", { cx: 64, cy: 64, r: R, class: "t-arc", "stroke-dasharray": C.toFixed(2), "stroke-dashoffset": "0", transform: "rotate(-90 64 64)" });
    const ring = s("svg", { viewBox: "0 0 128 128", class: "t-ring", "aria-hidden": "true" });
    ring.append(s("circle", { cx: 64, cy: 64, r: R, class: "t-track" }), arc);
    const big = h("div", { class: "t-big" }), label = h("div", { class: "t-lbl" });
    const main = h("button", { class: "btn", type: "button", onclick: toggleTimer });
    const presets = h("div", { class: "chips t-presets", role: "group", "aria-label": "Rest length" },
      PRESETS.map((v) => h("button", { class: "chip txt", type: "button", "data-v": String(v), onclick: () => setDur(v) }, fmtSec(v))));
    const live = h("div", { class: "sr", "aria-live": "assertive" });
    const panel = h("div", { class: "t-panel", id: "timer-panel", role: "dialog", "aria-label": "Rest timer", hidden: true },
      h("div", { class: "t-head" }, h("span", { class: "t-title" }, "Rest timer"),
        h("button", { class: "t-x", type: "button", "aria-label": "Close timer", onclick: () => { setTimerOpen(false); fab.focus(); } }, "×")),
      h("div", { class: "t-face" }, ring, h("div", { class: "t-read" }, big, label)),
      h("div", { class: "t-ctl" },
        h("button", { class: "btn ghost sm", type: "button", "aria-label": "15 seconds less", onclick: () => nudge(-15) }, "−15s"),
        main,
        h("button", { class: "btn ghost sm", type: "button", "aria-label": "15 seconds more", onclick: () => nudge(15) }, "+15s")),
      presets,
      h("div", { class: "t-foot" }, h("span", { class: "muted small" }, "Your rest length is remembered"),
        h("button", { class: "btn ghost sm", type: "button", onclick: resetTimer }, "Reset")),
      live);
    dock.replaceChildren(panel, fab);
    tEls = { dock, fab, fabTime, arc, C, big, label, main, presets, live, panel };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && T.open && !document.getElementById("done-dlg").open) { setTimerOpen(false); fab.focus(); }
    });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && T.end != null) tickTimer(); });
    paintTimer();
  }
  function setTimerOpen(open) {
    T.open = open;
    tEls.panel.hidden = !open;
    tEls.fab.setAttribute("aria-expanded", String(open));
    if (open) tEls.main.focus();
  }
  function paintTimer() {
    if (!tEls) return;
    const st = tState(), rem = tRemaining();
    const over = T.done && st === "idle";
    const frac = st === "idle" ? (over ? 0 : 1) : Math.max(0, Math.min(1, rem / (T.runDur || T.dur)));
    tEls.arc.setAttribute("stroke-dashoffset", (tEls.C * (1 - frac)).toFixed(2));
    tEls.big.textContent = over ? "0:00" : fmtSec(rem);
    tEls.label.textContent = over ? "Rest over. Next set" : st === "running" ? "Resting" : st === "paused" ? "Paused" : "Ready";
    tEls.main.textContent = st === "running" ? "Pause" : st === "paused" ? "Resume" : "Start";
    const fabTxt = over ? "Go" : st === "idle" ? fmtSec(T.dur) : fmtSec(rem);
    tEls.fabTime.textContent = fabTxt;
    tEls.fab.setAttribute("aria-label", "Rest timer: " + (over ? "rest over" : st === "idle" ? fmtSec(T.dur) + " ready" : fmtSec(rem) + (st === "paused" ? " paused" : " left")));
    tEls.dock.dataset.s = over ? "done" : st;
    for (const c of tEls.presets.children) c.setAttribute("aria-pressed", String(+c.dataset.v === T.dur));
  }
  function runTick() {
    clearInterval(T.tick); T.tick = null;
    if (T.end != null) T.tick = setInterval(tickTimer, 250);
  }
  function tickTimer() { if (T.end != null && tRemaining() <= 0) finishTimer(); else paintTimer(); }
  function startTimer(sec) {
    unlockAudio();
    clearTimeout(T.doneTimer); T.done = false;
    if (sec == null) { sec = T.left != null ? T.left : T.dur; if (T.left == null) T.runDur = T.dur; }
    else T.runDur = sec;
    T.left = null; T.end = Date.now() + sec * 1000;
    runTick(); paintTimer();
  }
  function toggleTimer() {
    if (tState() === "running") { T.left = Math.max(0, tRemaining()); T.end = null; runTick(); paintTimer(); }
    else startTimer();
  }
  function resetTimer() {
    clearTimeout(T.doneTimer);
    T.end = null; T.left = null; T.done = false; T.runDur = T.dur;
    runTick(); paintTimer();
  }
  function nudge(sec) {
    const st = tState();
    if (st === "idle") return setDur(T.dur + sec);
    if (st === "running") { T.end += sec * 1000; if (sec > 0) T.runDur = Math.max(T.runDur, tRemaining()); tickTimer(); }
    else { T.left = Math.max(0, T.left + sec); if (sec > 0) T.runDur = Math.max(T.runDur, T.left); paintTimer(); }
  }
  function setDur(v) {
    T.dur = clampDur(v); storeDur(); saveSettings(600);
    if (tState() === "running") startTimer(T.dur);
    else { T.left = null; T.done = false; T.runDur = T.dur; paintTimer(); }
  }
  function finishTimer() {
    T.end = null; T.left = null; T.done = true;
    runTick(); paintTimer();
    tEls.live.textContent = "Rest over";
    try { navigator.vibrate && navigator.vibrate([220, 120, 220, 120, 420]); } catch (_) {}
    beep();
    clearTimeout(T.doneTimer);
    T.doneTimer = setTimeout(() => { T.done = false; tEls.live.textContent = ""; paintTimer(); }, 12000);
  }
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!T.ac) T.ac = new AC();
      if (T.ac.state === "suspended") T.ac.resume();
    } catch (_) {}
  }
  function beep() {
    const ac = T.ac;
    if (!ac) return;
    try {
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime + 0.02;
      [0, 0.28, 0.56].forEach((o, i) => {
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.type = "sine"; osc.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, t0 + o);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + o + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + (i === 2 ? 0.45 : 0.2));
        osc.connect(g); g.connect(ac.destination);
        osc.start(t0 + o); osc.stop(t0 + o + 0.5);
      });
    } catch (_) {}
  }

  /* ---------- session complete screen ---------- */
  function celebrate(w, d) {
    const dlg = document.getElementById("done-dlg");
    if (!dlg || dlg.open) return;
    resetTimer(); if (T.open) setTimerOpen(false);
    const def = sessionDef(w, d);
    const doc = S.sessions[key(w, d)] || {};
    const checks = doc.checks || {};
    const here = (w - 1) * 7 + d;
    const perWeek = trainingDaysPerWeek();
    let wkDone = 0, allDone = 0;
    for (let ww = 1; ww <= TOTAL_WEEKS; ww++) for (let dd = 0; dd < 7; dd++) if (statusOf(ww, dd) === "done") { allDone++; if (ww === w) wkDone++; }

    // Each logged lift against the best from earlier sessions (est. 1RM where reps are logged, else weight).
    const lifts = [];
    for (const b of def.blocks) for (const it of b.items) {
      const tr = trackOf(it, b);
      const l = tr && doc.lifts && doc.lifts[it.id];
      if (!hasLift(l)) continue;
      const score = (x) => scoreOf(x, tr);
      const cur = score(l);
      let best = null;
      for (let i = 0; i < here; i++) {
        const pl = (S.sessions[key(Math.floor(i / 7) + 1, i % 7)] || {}).lifts;
        const v = pl && hasLift(pl[it.id]) ? score(pl[it.id]) : null;
        if (v != null && (best == null || v > best)) best = v;
      }
      lifts.push({ name: it.name, txt: withRpe(l, tr), pr: cur != null && best != null && cur > best ? Math.round((cur - best) * 10) / 10 : null, first: best == null && tr !== "cardio", unit: tr === "wr" ? "lb e1RM" : TRACKS[tr].unit });
    }
    const prs = lifts.filter((x) => x.pr != null).length;

    let next = null;
    for (let i = here + 1; i < TOTAL_WEEKS * 7; i++) {
      const nw = Math.floor(i / 7) + 1, nd = i % 7, nd2 = sessionDef(nw, nd);
      if (!nd2.rest) { next = { def: nd2, date: dateOf(nw, nd) }; break; }
    }

    const badge = h("div", { class: "d-badge", "aria-hidden": "true" },
      h("div", { class: "d-burst" }, Array.from({ length: 14 }, (_, i) => h("i", { style: "--a:" + Math.round((360 / 14) * i) + "deg" }))));
    const svg = s("svg", { viewBox: "0 0 104 104" });
    svg.append(s("circle", { cx: 52, cy: 52, r: 50, class: "d-disc" }), s("path", { d: "M33 54 L46 66 L72 39", class: "d-check" }));
    badge.append(svg);

    const close = () => dlg.close();
    const card = h("div", { class: "d-card" },
      badge,
      h("div", null,
        h("div", { class: "d-eyebrow" }, "Week " + w + " · " + def.day.name + " · " + fmtDate(dateOf(w, d), { month: "short", day: "numeric" })),
        h("h2", { class: "d-title", id: "d-title" }, "Session complete"),
        h("p", { class: "d-sub" }, def.title)),
      h("div", { class: "d-stats" },
        h("div", { class: "d-stat" }, h("b", null, def.items.filter((it) => checks[it.id]).length + "/" + def.items.length), h("span", null, "Exercises")),
        h("div", { class: "d-stat" }, h("b", null, wkDone + "/" + perWeek), h("span", null, "This week")),
        h("div", { class: "d-stat" }, h("b", null, allDone + "/" + perWeek * TOTAL_WEEKS), h("span", null, "Program"))),
      lifts.length ? h("div", { class: "d-lifts" },
        h("div", { class: "eyebrow" }, h("span", null, "Today's log"), prs ? h("b", null, prs + (prs === 1 ? " new best" : " new bests")) : null),
        lifts.map((x) => h("div", { class: "d-lift" },
          h("span", null, x.name),
          h("span", null, h("span", { class: "v" }, x.txt),
            x.pr != null ? h("span", { class: "d-pr" }, "+" + fmtDelta(x.pr, x.unit)) : x.first ? h("span", { class: "d-new" }, "first log") : null)))) : null,
      namedExtras(doc).length ? h("p", { class: "d-next" }, "Extra: ", h("b", null, namedExtras(doc).map(fmtExtra).join(" · "))) : null,
      next ? h("p", { class: "d-next" }, "Next up: ", h("b", null, fmtDate(next.date, { weekday: "short", month: "short", day: "numeric" }) + " · " + next.def.title)) : h("p", { class: "d-next" }, h("b", null, "That's the last session of the block.")),
      h("div", { class: "d-actions" },
        h("button", { class: "btn ghost", type: "button", onclick: () => { close(); const n = document.getElementById("notes"); if (n) { n.focus(); n.scrollIntoView({ block: "center" }); } } }, "Add notes"),
        h("button", { class: "btn", type: "button", onclick: close, autofocus: true }, "Done")));
    dlg.replaceChildren(card);
    if (!dlg.dataset.wired) {
      dlg.dataset.wired = "1";
      dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    }
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    try { navigator.vibrate && navigator.vibrate(60); } catch (_) {}
  }

  /* ---------- boot ---------- */
  async function boot() {
    buildTimer();
    readRoute();
    try {
      const r = await fetch("plan.json", { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status);
      S.plan = await r.json();
    } catch (e) {
      view.replaceChildren(h("div", { class: "empty" }, "The training plan (plan.json) didn't load. Reload the page to try again."));
      return;
    }
    S.start = iso(mondayOnOrAfter(todayDate()));
    selectToday();
    render();
    connect();
  }
  boot();
})();
</script>
</body>
</html>
